<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-label="狐獴 monoline logo">
  <!-- 三个纯色圆：青 / 橙 / 沙 -->
  <circle cx="660" cy="300" r="130" fill="#E1663A"/>
  <circle cx="340" cy="530" r="130" fill="#0E6B77"/>
  <circle cx="690" cy="640" r="118" fill="#E9C48A"/>

  <!-- 狐獴：单线 + 白填充 -->
  <g transform="translate(500 500) scale(9.4) translate(-32 -32)"
     fill="#fff" stroke="#111" stroke-width="0.95" stroke-linejoin="round" stroke-linecap="round">

    <!-- 尾巴 -->
    <path d="M27.6 43.8c-3.4 4.2-9.4 6.6-13.8 5.2-2.0-.6-2.2-3.0-.2-3.7 1.9-.7 3.7.5 5.6 1.8 3.1 2.1 6.3-.6 8.1-3.9z"/>
    <!-- 脚 -->
    <ellipse cx="28.0" cy="52.7" rx="3.3" ry="1.85"/>
    <ellipse cx="35.6" cy="52.7" rx="3.3" ry="1.85"/>
    <!-- 耳 -->
    <circle cx="26.6" cy="10.2" r="2.2"/>
    <!-- 身体 -->
    <path d="M31.2 8.6c3.6 0 6.4 2.8 7.4 6 1.6.4 4.4 1.6 6.6 3 1.8 1.2.8 2.8-1.8 3.3-1.8.3-3.8.7-5 1.3-.4.8-.8 1.6-1 2.4 2.2 3.8 3 10 2.5 16.4-.4 5.4-2.1 9.2-5.1 10.6-2.8 1.3-7.2 1.3-8.6-.4-2-2.6-2.8-8.4-2.2-14.8.5-5.6 1.6-10.2 3.2-12.2-2-1.4-3-5-2.6-8.4.4-4.4 3.2-7.2 6.6-7.2z"/>

    <!-- 胸口线 -->
    <path d="M30.2 25.6c1.5 4.2 2 10 1.4 15.4" fill="none" stroke-width="0.8"/>
    <!-- 前爪 -->
    <path d="M29.6 32.4c-1 2.4-1.4 5.2-1 7.6" fill="none" stroke-width="0.8"/>
    <!-- 嘴角 -->
    <path d="M38.4 19.2c-2.4 1.6-5.2 2.2-7.6 1.8" fill="none" stroke-width="0.8"/>
  </g>

  <!-- 墨镜：小一号，落在脸上，露出额头 -->
  <g transform="translate(500 500) scale(9.4) translate(-32 -32)" fill="#111">
    <path d="M26.9 12.5c2.4-1.2 5.4-1 7.6.5 1 .7 1.4 1.6 1.4 2.4 0 .9-.7 1.5-1.9 1.6-2.6.3-5.5-.4-7.3-1.7-1-.7-1.4-1.5-1.3-2.2 0-.3.5-.5 1.5-.6z"/>
    <path d="M36.4 13.9c2-.6 4.3-.3 5.9.8.7.5 1 1.1.9 1.7-.1.6-.7 1-1.6 1.1-2.1.2-4.3-.4-5.7-1.5-.7-.5-1-1.1-.9-1.5.1-.3.5-.5 1.4-.6z"/>
    <!-- 镜桥 -->
    <rect x="33.0" y="12.9" width="3.9" height="1.0" rx=".5" transform="rotate(8 35 13.4)"/>
    <!-- 镜腿 -->
    <path d="M26.4 12.9 24.9 12.4" stroke="#111" stroke-width="1.1" stroke-linecap="round" fill="none"/>
  </g>
</svg>
