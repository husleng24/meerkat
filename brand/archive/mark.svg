<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" role="img" aria-label="狐獴 Meerkat 标记">
  <g fill="#12222A">
    <!-- 尾巴：落地，构成哨兵姿态的第三支点 -->
    <path d="M27.6 43.8c-3.4 4.2-9.4 6.6-13.8 5.2-2.0-.6-2.2-3.0-.2-3.7 1.9-.7 3.7.5 5.6 1.8 3.1 2.1 6.3-.6 8.1-3.9z"/>

    <!-- 耳：小圆凸，融进头部轮廓 -->
    <circle cx="26.9" cy="10.6" r="2.3"/>

    <!-- 头 + 吻 + 颈 + 躯干，一笔成型 -->
    <path d="M31.2 8.6c3.6 0 6.4 2.8 7.4 6 1.6.4 4.4 1.6 6.6 3 1.8 1.2.8 2.8-1.8 3.3-1.8.3-3.8.7-5 1.3-.4.8-.8 1.6-1 2.4 2.2 3.8 3 10 2.5 16.4-.4 5.4-2.1 9.2-5.1 10.6-2.8 1.3-7.2 1.3-8.6-.4-2-2.6-2.8-8.4-2.2-14.8.5-5.6 1.6-10.2 3.2-12.2-2-1.4-3-5-2.6-8.4.4-4.4 3.2-7.2 6.6-7.2z"/>

    <!-- 脚 -->
    <ellipse cx="28.0" cy="52.7" rx="3.3" ry="1.85"/>
    <ellipse cx="35.6" cy="52.7" rx="3.3" ry="1.85"/>
  </g>

  <!-- 眼睛：唯一的内部细节 -->
  <circle cx="34.6" cy="14.3" r="1.65" fill="#EFD9B0"/>
</svg>
