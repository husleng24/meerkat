name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # 版本由 package.json 的 packageManager 决定，这里不要再写 version，
      # 否则 pnpm 会因为两处版本不一致直接失败（ERR_PNPM_BAD_PM_VERSION）
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm typecheck

      - run: pnpm build

      - name: Package
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
        run: |
          if [ "$PLATFORM" = "mac" ] && [ -n "$CSC_LINK" ]; then
            # App Store Connect API Key 只以 base64 secret 保存，构建时落盘
            printf '%s' "$APPLE_API_KEY_P8" | openssl base64 -d -A -out "$APPLE_API_KEY"
            pnpm exec electron-builder --mac --publish never -c.mac.notarize=true
          elif [ "$PLATFORM" = "mac" ]; then
            echo "::warning::macOS signing secrets are empty; building an ad-hoc dmg"
            pnpm exec electron-builder --mac --publish never -c.mac.identity=-
          else
            CSC_IDENTITY_AUTO_DISCOVERY=false pnpm exec electron-builder --win --publish never
          fi

      - name: Notarize and staple dmg
        if: matrix.platform == 'mac'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$CSC_LINK" ]; then exit 0; fi
          for dmg in release/*.dmg; do
            xcrun notarytool submit "$dmg"               --key "$APPLE_API_KEY"               --key-id "$APPLE_API_KEY_ID"               --issuer "$APPLE_API_ISSUER" --wait
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: meerkat-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.zip
          if-no-files-found: error

  release:
    name: publish draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --draft \
            --title "Meerkat ${GITHUB_REF_NAME}" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
