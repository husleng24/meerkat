appId: com.meerkat.daily
productName: Meerkat
copyright: Meerkat

directories:
  output: release
  buildResources: build


# asar 打包，但原生模块必须解包：better-sqlite3 的 .node 文件
# 在 asar 里无法 dlopen（经典坑，表现为启动即崩）
asar: true
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
  - '**/*.node'

files:
  - out/**
  - package.json

# 开发态从 app.getAppPath() 读，打包后从 process.resourcesPath 读（见 src/main/paths.ts）
extraResources:
  - from: resources
    to: resources
  - from: brand
    to: brand

win:
  # 本机（Windows 开发机）的实时防护会拦下 NSIS 卸载器的生成步骤，
  # 所以本地出包用 portable/zip；GitHub Actions 的 Windows runner 上出 NSIS 安装包。
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico
  artifactName: ${productName}-${version}-${arch}.${ext}

portable:
  artifactName: ${productName}-${version}-portable.${ext}
  requestExecutionLevel: user

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Meerkat
  deleteAppDataOnUninstall: false

mac:
  # 没有证书，用 "-" 做 ad-hoc 签名；必须配合 entitlements 关闭库校验，
  # 否则 Frameworks 里的 ad-hoc dylib 会被 AMFI 拒绝，双击无法启动
  identity: "-"
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: build/icon.icns
  category: public.app-category.productivity
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  target: [AppImage]
  icon: build/icon.png
  category: Office

# 发布走 GitHub Releases：tag 推上去后由 .github/workflows/release.yml 出包并上传
publish:
  provider: github
  owner: husleng24
  repo: meerkat
  releaseType: draft
